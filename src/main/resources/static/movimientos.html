<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Movimientos — SpringBank</title>
<link rel="stylesheet" href="/css/styles.css"/>
<style>
  .page-wrap    { max-width: 1060px; margin: 0 auto; padding: 36px 24px 80px; }

  .acct-header  {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; margin-bottom: 32px;
  }
  .acct-info    { display: flex; align-items: center; gap: 14px; }
  .acct-icon    {
    width: 48px; height: 48px; border-radius: var(--r-lg);
    background: var(--green-900); display: flex; align-items: center; justify-content: center;
  }
  .acct-detail  { }
  .acct-n       { font-family: var(--font-d); font-size: 1.5rem; font-weight: 700; color: var(--green-900); line-height: 1; }
  .acct-meta    { color: var(--muted); font-size: .875rem; margin-top: 3px; display: flex; align-items: center; gap: 8px; }
  .saldo-val    { font-weight: 700; color: var(--green-800); }

  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 20px;
    padding: 18px 20px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); box-shadow: var(--sh-xs);
  }
  .filters .fg  { flex: 1; min-width: 140px; }
  .filter-actions { display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }

  .results-bar  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .results-count{ color: var(--muted); font-size: .875rem; }

  .skel-row     { height: 44px; border-radius: var(--r-md); background: var(--skel-bg,#e6ebe6); margin-bottom: 8px; animation: skelPulse 1.4s ease-in-out infinite; }
  @keyframes skelPulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  @media (max-width: 600px) {
    .acct-header { flex-direction: column; align-items: flex-start; }
    .filters .fg { min-width: 100%; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/dashboard">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect width="30" height="30" rx="8" fill="var(--green-900)"/>
        <path d="M15 4L5 9.5H25L15 4Z" fill="#52B788"/>
        <rect x="7" y="12" width="3" height="8" rx=".5" fill="white" opacity=".65"/>
        <rect x="12" y="12" width="3" height="8" rx=".5" fill="white" opacity=".65"/>
        <rect x="17" y="12" width="3" height="8" rx=".5" fill="white" opacity=".65"/>
        <rect x="22" y="12" width="3" height="8" rx=".5" fill="white" opacity=".65"/>
        <rect x="5" y="22" width="20" height="2" rx=".5" fill="#52B788"/>
      </svg>
      SpringBank
    </a>
    <div class="nav-actions">
      <a href="/dashboard" class="btn btn--ghost btn--sm">← Inicio</a>
    </div>
  </div>
</nav>

<main class="page-wrap fade-up">

  <!-- Info de cuenta -->
  <div class="acct-header" id="acctHeader">
    <div class="acct-info">
      <div class="acct-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
          <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
        </svg>
      </div>
      <div class="acct-detail">
        <div class="acct-n" id="acctNum">—</div>
        <div class="acct-meta">
          <span id="acctTipo">—</span>
          <span>·</span>
          <span>Saldo: <span class="saldo-val" id="acctSaldo">—</span></span>
        </div>
      </div>
    </div>
    <button class="btn btn--outline btn--sm" id="exportBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar CSV
    </button>
  </div>

  <!-- Filtros -->
  <div class="filters fade-up" style="animation-delay:60ms">
    <div class="fg">
      <label class="label" for="filTipo">Tipo</label>
      <select class="input" id="filTipo">
        <option value="">Todos los tipos</option>
        <option value="DEPOSITO">Depósito</option>
        <option value="RETIRO">Retiro</option>
        <option value="TRANSFERENCIA">Transferencia</option>
      </select>
    </div>
    <div class="fg">
      <label class="label" for="filEstado">Estado</label>
      <select class="input" id="filEstado">
        <option value="">Todos los estados</option>
        <option value="COMPLETADA">Completada</option>
        <option value="ACTIVA">Activa</option>
        <option value="FALLIDA">Fallida</option>
        <option value="ABORTADA">Abortada</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn btn--ghost btn--sm" id="clearFil">Limpiar</button>
    </div>
  </div>

  <!-- Skeleton -->
  <div id="txSkel">
    <div class="skel-row"></div>
    <div class="skel-row" style="animation-delay:.1s"></div>
    <div class="skel-row" style="animation-delay:.2s"></div>
    <div class="skel-row" style="animation-delay:.3s"></div>
    <div class="skel-row" style="animation-delay:.4s"></div>
  </div>

  <!-- Tabla -->
  <div id="txContainer" style="display:none">
    <div class="results-bar">
      <span class="results-count" id="resCount"></span>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Contraparte</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th style="text-align:right">Monto</th>
          </tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Empty -->
  <div class="empty" id="txEmpty" style="display:none">
    <div class="empty-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
    </div>
    <div class="empty-title">Sin resultados</div>
    <div class="empty-sub">No hay transacciones que coincidan con los filtros seleccionados.</div>
  </div>

</main>

<script type="module">
import { api, toast, fmtMoney, fmtDate, requireRole } from '/js/api.js';

requireRole('CLIENTE');

const params = new URLSearchParams(location.search);
const numeroCuenta = Number(params.get('cuenta'));

if (!numeroCuenta) {
  toast('No se especificó una cuenta.', 'error');
  setTimeout(() => { location.href = '/dashboard'; }, 1500);
}

let allTx = [];

async function load() {
  const [cuentaData, txData] = await Promise.all([
    api(`/cuentas/${numeroCuenta}/saldo`),
    api(`/cuentas/${numeroCuenta}/transacciones`),
  ]);

  // Header de cuenta
  document.getElementById('acctNum').textContent  = cuentaData.numeroCuenta;
  document.getElementById('acctTipo').innerHTML    = `<span class="badge ${cuentaData.tipoCuenta === 'CORRIENTE' ? 'badge-corriente' : 'badge-ahorro'}">${cuentaData.tipoCuenta}</span>`;
  document.getElementById('acctSaldo').textContent = fmtMoney(cuentaData.saldo);

  allTx = txData ?? [];

  document.getElementById('txSkel').style.display = 'none';
  document.getElementById('exportBtn').disabled = allTx.length === 0;

  renderTable(allTx);
}

function esEntrada(tx) {
  if (tx.tipo === 'DEPOSITO') return true;
  if (tx.tipo === 'RETIRO')   return false;
  return Number(tx.numeroCuentaDestino) === numeroCuenta;
}

function contraparteTxt(tx) {
  if (tx.tipo === 'DEPOSITO')     return '—';
  if (tx.tipo === 'RETIRO')       return '—';
  if (esEntrada(tx))              return `De ${tx.numeroCuentaOrigen}`;
  return `A ${tx.numeroCuentaDestino}`;
}

function renderTable(txs) {
  const body  = document.getElementById('txBody');
  const count = document.getElementById('resCount');
  body.innerHTML = '';

  if (txs.length === 0) {
    document.getElementById('txContainer').style.display = 'none';
    document.getElementById('txEmpty').style.display     = 'flex';
    count.textContent = '';
    return;
  }

  document.getElementById('txEmpty').style.display     = 'none';
  document.getElementById('txContainer').style.display = 'block';
  count.textContent = `${txs.length} movimiento${txs.length !== 1 ? 's' : ''}`;

  txs.forEach(tx => {
    const entrada = esEntrada(tx);
    body.insertAdjacentHTML('beforeend', `
      <tr>
        <td style="white-space:nowrap;color:var(--muted);font-size:.8125rem">${fmtDate(tx.fecha)}</td>
        <td><span class="badge badge-${(tx.tipo ?? '').toLowerCase()}">${tx.tipo}</span></td>
        <td style="color:var(--muted);font-size:.875rem">${contraparteTxt(tx)}</td>
        <td style="color:var(--muted);font-size:.8125rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tx.motivo ?? '—'}</td>
        <td><span class="badge badge-${(tx.estado ?? '').toLowerCase()}">${tx.estado}</span></td>
        <td style="text-align:right;font-weight:600" class="${entrada ? 'amt-pos' : 'amt-neg'}">
          ${entrada ? '+' : '−'}${fmtMoney(Math.abs(tx.monto))}
        </td>
      </tr>
    `);
  });
}

function applyFilters() {
  const tipo   = document.getElementById('filTipo').value;
  const estado = document.getElementById('filEstado').value;

  const filtered = allTx.filter(tx =>
    (!tipo   || tx.tipo   === tipo) &&
    (!estado || tx.estado === estado)
  );
  renderTable(filtered);
}

document.getElementById('filTipo').addEventListener('change',   applyFilters);
document.getElementById('filEstado').addEventListener('change', applyFilters);
document.getElementById('clearFil').addEventListener('click', () => {
  document.getElementById('filTipo').value   = '';
  document.getElementById('filEstado').value = '';
  renderTable(allTx);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const tipo   = document.getElementById('filTipo').value;
  const estado = document.getElementById('filEstado').value;
  const data   = allTx.filter(tx =>
    (!tipo   || tx.tipo   === tipo) &&
    (!estado || tx.estado === estado)
  );

  const headers = ['Fecha','Tipo','Monto','Cuenta Origen','Cuenta Destino','Estado','Descripcion'];
  const rows = data.map(tx => [
    fmtDate(tx.fecha),
    tx.tipo,
    tx.monto,
    tx.numeroCuentaOrigen ?? '',
    tx.numeroCuentaDestino ?? '',
    tx.estado,
    (tx.motivo ?? '').replace(/"/g, '""'),
  ]);

  const csv = [headers, ...rows]
    .map(r => r.map(v => `"${v}"`).join(','))
    .join('\n');

  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `movimientos-${numeroCuenta}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado.');
});

load().catch(err => {
  document.getElementById('txSkel').style.display = 'none';
  toast(err.message ?? 'Error al cargar los movimientos.', 'error');
});
</script>
</body>
</html>
